<!doctype html>
<html lang="en" data-theme="dark" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Browser TTS — Precision text-to-speech tools engineered with the Web Speech API" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" />
  <title>Browser TTS — Web Speech Studio</title>

  <!-- Prevent theme flicker -->
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('sd-theme') || localStorage.getItem('theme');
        const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#111213' : '#fbfbfb');
      } catch {}
    })();
  </script>
</head>

<body class="bg-[var(--bg)] text-[var(--fg)] min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
